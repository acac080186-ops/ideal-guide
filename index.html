<script>
    let currentUser = JSON.parse(localStorage.getItem('sunlight_current_user')) || null;
    let countdownInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
        const entered = localStorage.getItem('sunlight_entered');
        if (entered === 'true') {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('flex');
        }
        updateAuthUI();
        loadScripts();
    });

    function joinDiscord() {
        const discordBtn = document.getElementById('discordBtn');
        const enterBtn = document.getElementById('enterWebBtn');
        const enterBtnText = document.getElementById('enterBtnText');

        // กันกดซ้ำ
        if (discordBtn.disabled) return;

        // เปิด Discord
        window.open('https://discord.gg/yUUz7jWa5', '_blank');

        // Disable Discord button
        discordBtn.disabled = true;
        discordBtn.classList.add('opacity-50', 'cursor-not-allowed');
        document.getElementById('discordBtnText').innerText = "กรุณารอสักครู่...";

        // แสดงข้อความสถานะ
        document.getElementById('statusMsg').innerText = "กำลังเตรียมระบบ...";

        // เริ่มนับถอยหลัง 10 วินาที
        let timeLeft = 10;

        // ล้าง interval เก่า (ถ้ามี)
        if (countdownInterval) clearInterval(countdownInterval);

        // อัปเดตครั้งแรกทันที
        enterBtnText.innerHTML = `กรุณารอ <span class="text-neonPurple font-bold animate-pulse">${timeLeft}</span> วินาที`;

        countdownInterval = setInterval(() => {
            timeLeft--;

            if (timeLeft > 0) {
                enterBtnText.innerHTML = `กรุณารอ <span class="text-neonPurple font-bold animate-pulse">${timeLeft}</span> วินาที`;
            } else {
                // ✅ นับเสร็จแล้ว
                clearInterval(countdownInterval);
                countdownInterval = null;

                // คืนค่าปุ่ม Discord
                discordBtn.disabled = false;
                discordBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                document.getElementById('discordBtnText').innerText = "เข้าร่วม Discord อีกครั้ง";

                // ปลดล็อกปุ่มเข้าสู่เว็บ
                enterBtn.removeAttribute('disabled');
                enterBtn.classList.remove('bg-purple-900/40', 'text-gray-500', 'cursor-not-allowed', 'border-purple-900/50');
                enterBtn.classList.add('bg-neonPurple', 'hover:bg-neonPurpleHover', 'text-white', 'neon-glow-sm');
                enterBtnText.innerText = "เข้าสู่เว็บ";

                document.getElementById('statusMsg').innerText = "✅ ระบบพร้อมใช้งานแล้ว!";
            }
        }, 1000);
    }

    function enterWebsite() {
        const enterBtn = document.getElementById('enterWebBtn');
        if (enterBtn.hasAttribute('disabled')) return;

        localStorage.setItem('sunlight_entered', 'true');
        const welcome = document.getElementById('welcomeScreen');
        welcome.style.opacity = '0';
        setTimeout(() => {
            welcome.style.display = 'none';
            const main = document.getElementById('mainApp');
            main.classList.remove('hidden');
            main.classList.add('flex');
        }, 700);
    }

    function openAuthModal() {
        document.getElementById('authModal').style.display = 'flex';
    }
    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('authErrorMsg').classList.add('hidden');
    }

    function switchAuthTab(tab) {
        const loginTab = document.getElementById('loginTabBtn');
        const regTab = document.getElementById('registerTabBtn');
        const loginForm = document.getElementById('loginForm');
        const regForm = document.getElementById('registerForm');
        document.getElementById('authErrorMsg').classList.add('hidden');

        if (tab === 'login') {
            loginTab.className = "flex-1 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 bg-neonPurple text-white";
            regTab.className = "flex-1 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 text-gray-400 hover:text-white";
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
        } else {
            regTab.className = "flex-1 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 bg-neonPurple text-white";
            loginTab.className = "flex-1 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 text-gray-400 hover:text-white";
            regForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        }
    }

    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('loginUser').value.trim();
        const pass = document.getElementById('loginPass').value;

        if (user === 'Sunlight hub 2626' && pass === 'Sunlight shop 2626') {
            currentUser = { username: 'Sunlight hub 2626', role: 'admin' };
            localStorage.setItem('sunlight_current_user', JSON.stringify(currentUser));
            closeAuthModal();
            updateAuthUI();
            showToast('เข้าสู่ระบบแอดมินสำเร็จ! ✨');
            return;
        }

        let users = JSON.parse(localStorage.getItem('sunlight_users')) || [];
        let found = users.find(u => (u.username === user || u.email === user) && u.password === pass);

        if (found) {
            currentUser = { username: found.username, role: 'user' };
            localStorage.setItem('sunlight_current_user', JSON.stringify(currentUser));
            closeAuthModal();
            updateAuthUI();
            showToast('เข้าสู่ระบบสำเร็จ!');
        } else {
            document.getElementById('errorText').innerText = "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง!";
            document.getElementById('authErrorMsg').classList.remove('hidden');
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        const username = document.getElementById('regUser').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPass').value;

        let users = JSON.parse(localStorage.getItem('sunlight_users')) || [];
        if (users.some(u => u.username === username || u.email === email)) {
            document.getElementById('errorText').innerText = "ชื่อผู้ใช้หรืออีเมลนี้ถูกใช้งานแล้ว!";
            document.getElementById('authErrorMsg').classList.remove('hidden');
            return;
        }

        users.push({ username, email, password });
        localStorage.setItem('sunlight_users', JSON.stringify(users));

        currentUser = { username, role: 'user' };
        localStorage.setItem('sunlight_current_user', JSON.stringify(currentUser));
        closeAuthModal();
        updateAuthUI();
        showToast('สมัครสมาชิกและเข้าสู่ระบบสำเร็จ! 🎉');
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('sunlight_current_user');
        updateAuthUI();
        showToast('ออกจากระบบแล้ว');
    }

    function updateAuthUI() {
        const authContainer = document.getElementById('authContainer');
        const adminBtn = document.getElementById('adminBtn');

        if (currentUser) {
            authContainer.innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-xs md:text-sm text-gray-300 hidden sm:inline"><i class="fa-solid fa-user text-neonPurple mr-1"></i> ${escapeHtml(currentUser.username)}</span>
                    <button onclick="logout()" class="bg-red-950/60 hover:bg-red-900 border border-red-500/40 text-red-300 px-3 py-1.5 rounded-xl text-xs font-medium transition-all duration-300">
                        ออกจากระบบ
                    </button>
                </div>
            `;
            if (currentUser.role === 'admin') {
                adminBtn.classList.remove('hidden');
            } else {
                adminBtn.classList.add('hidden');
            }
        } else {
            authContainer.innerHTML = `
                <button onclick="openAuthModal()" class="bg-neonPurple hover:bg-neonPurpleHover text-white px-4 py-2 rounded-xl font-medium text-sm transition-all duration-300 neon-glow-sm flex items-center gap-2">
                    <i class="fa-solid fa-user-circle"></i> เข้าสู่ระบบ / สมัครสมาชิก
                </button>
            `;
            adminBtn.classList.add('hidden');
        }
        loadScripts();
    }

    function toggleAdminPanel() {
        const modal = document.getElementById('adminModal');
        if (modal.style.display === 'flex') {
            modal.style.display = 'none';
        } else {
            modal.style.display = 'flex';
        }
    }

    function saveScript(e) {
        e.preventDefault();
        if (!currentUser || currentUser.role !== 'admin') {
            showToast('เฉพาะแอดมินเท่านั้น!');
            return;
        }

        const name = document.getElementById('scriptName').value;
        const creator = document.getElementById('scriptCreator').value;
        const url = document.getElementById('scriptUrl').value;
        const desc = document.getElementById('scriptDesc').value;

        let scripts = JSON.parse(localStorage.getItem('sunlight_scripts')) || [];
        scripts.unshift({ id: Date.now(), name, creator, url, desc });
        localStorage.setItem('sunlight_scripts', JSON.stringify(scripts));

        document.getElementById('scriptForm').reset();
        toggleAdminPanel();
        loadScripts();
        showToast('บันทึกสคริปต์สำเร็จ! ✨');
    }

    function deleteScript(id) {
        if (!currentUser || currentUser.role !== 'admin') {
            showToast('เฉพาะแอดมินเท่านั้น!');
            return;
        }
        if (confirm('คุณต้องการลบสคริปต์นี้ใช่หรือไม่?')) {
            let scripts = JSON.parse(localStorage.getItem('sunlight_scripts')) || [];
            scripts = scripts.filter(s => s.id !== id);
            localStorage.setItem('sunlight_scripts', JSON.stringify(scripts));
            loadScripts();
            showToast('ลบสคริปต์เรียบร้อยแล้ว');
        }
    }

    function copyScriptUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            showToast('คัดลอกลิงก์/สคริปต์สำเร็จ! 📋');
        }).catch(err => {
            console.error('Copy failed', err);
            showToast('ไม่สามารถคัดลอกได้');
        });
    }

    function loadScripts() {
        const grid = document.getElementById('scriptsGrid');
        const badge = document.getElementById('scriptCountBadge');
        let scripts = JSON.parse(localStorage.getItem('sunlight_scripts')) || [];
        
        badge.innerText = `${scripts.length} รายการ`;

        if (scripts.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-16 glass-panel rounded-3xl">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-purple-900/30 border border-neonPurple/30 flex items-center justify-center text-neonPurple">
                        <i class="fa-solid fa-folder-open text-2xl"></i>
                    </div>
                    <p class="text-gray-400 text-base font-medium">ยังไม่มีสคริปต์</p>
                </div>
            `;
            return;
        }

        renderScriptCards(scripts);
    }

    function filterScripts() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let scripts = JSON.parse(localStorage.getItem('sunlight_scripts')) || [];
        let filtered = scripts.filter(s => s.name.toLowerCase().includes(query) || s.creator.toLowerCase().includes(query));
        renderScriptCards(filtered);
    }

    function renderScriptCards(scripts) {
        const grid = document.getElementById('scriptsGrid');
        grid.innerHTML = '';

        scripts.forEach(s => {
            const card = document.createElement('div');
            card.className = "glass-panel p-6 rounded-3xl flex flex-col justify-between transition-all duration-300 hover:border-neonPurple hover:neon-glow-sm relative group";
            
            let deleteBtnHtml = '';
            if (currentUser && currentUser.role === 'admin') {
                deleteBtnHtml = `
                    <button onclick="deleteScript(${s.id})" class="bg-red-950/60 hover:bg-red-900 border border-red-500/40 text-red-300 px-3 py-2 rounded-xl text-xs font-medium transition-all duration-300 flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i> ลบ
                    </button>
                `;
            }

            card.innerHTML = `
                <div>
                    <div class="flex items-start justify-between gap-4 mb-3">
                        <h3 class="font-bold text-lg text-white group-hover:text-neonPurple transition-colors">${escapeHtml(s.name)}</h3>
                        <span class="text-xs bg-purple-950/80 border border-purple-800 text-purple-300 px-2.5 py-1 rounded-full">
                            โดย ${escapeHtml(s.creator)}
                        </span>
                    </div>
                    <p class="text-gray-300 text-sm mb-6 leading-relaxed line-clamp-3">${escapeHtml(s.desc)}</p>
                </div>
                <div class="flex items-center gap-2 pt-4 border-t border-purple-900/30">
                    <button onclick="copyScriptUrl('${escapeHtml(s.url)}')" class="flex-1 bg-neonPurple hover:bg-neonPurpleHover text-white py-2.5 px-3 rounded-xl text-xs font-medium transition-all duration-300 neon-glow-sm flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-copy"></i> คัดลอกสคริปต์
                    </button>
                    ${deleteBtnHtml}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function escapeHtml(text) {
        if (typeof text !== 'string') return text;
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function showToast(text) {
        const toast = document.getElementById('toast');
        document.getElementById('toastText').innerText = text;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
            toast.classList.add('translate-y-20', 'opacity-0');
        }, 3000);
    }
</script>
